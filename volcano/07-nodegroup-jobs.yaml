apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-learn-07-coeus-job
  namespace: infra-demo-prod
  labels:
    app: volcano-learn
    lesson: "07"
    pool: coeus
spec:
  schedulerName: volcano
  queue: volcano-learn-07-coeus
  minAvailable: 1
  ttlSecondsAfterFinished: 300
  tasks:
    - name: worker
      replicas: 1
      minAvailable: 1
      template:
        metadata:
          labels:
            app: volcano-learn
            lesson: "07"
            pool: coeus
          annotations:
            cni: macvlan
        spec:
          # 故意不设置 nodeSelector 或 Pod nodeAffinity。
          # 节点限制只来自 Job -> Queue -> NodeGroup。
          restartPolicy: Never
          containers:
            - name: worker
              image: hub.bilibili.co/compile/library/busybox:1.36.1
              imagePullPolicy: IfNotPresent
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              command:
                - sh
                - -c
                - echo "lesson=07 pool=coeus pod=${POD_NAME} node=${NODE_NAME}"; sleep 120
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
---
