apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-learn-08-seed
  namespace: infra-demo-prod
  labels:
    app: volcano-learn
    lesson: "08"
    case: seed
spec:
  schedulerName: volcano
  queue: volcano-learn-08-binpack
  minAvailable: 1
  ttlSecondsAfterFinished: 300
  tasks:
    - name: worker
      replicas: 1
      minAvailable: 1
      template:
        metadata:
          labels:
            app: volcano-learn
            lesson: "08"
            case: seed
          annotations:
            cni: macvlan
        spec:
          # 背景 Job 固定到 A，制造 requests 差异；不是被测调度结果。
          nodeSelector:
            kubernetes.io/hostname: 10.159.110.29
          restartPolicy: Never
          containers:
            - name: worker
              image: hub.bilibili.co/compile/library/busybox:1.36.1
              imagePullPolicy: IfNotPresent
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              command:
                - sh
                - -c
                - echo "lesson=08 case=seed pod=${POD_NAME} node=${NODE_NAME}"; sleep 900
              resources:
                requests:
                  cpu: "2"
                  memory: 64Mi
                limits:
                  cpu: "2"
                  memory: 64Mi
