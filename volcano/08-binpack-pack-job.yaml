apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-learn-08-pack
  namespace: infra-demo-prod
  labels:
    app: volcano-learn
    lesson: "08"
    case: pack
spec:
  schedulerName: volcano
  queue: volcano-learn-08-binpack
  minAvailable: 6
  ttlSecondsAfterFinished: 300
  tasks:
    - name: worker
      replicas: 6
      minAvailable: 6
      template:
        metadata:
          labels:
            app: volcano-learn
            lesson: "08"
            case: pack
          annotations:
            cni: macvlan
        spec:
          # 只限制两个候选节点；不指定 preferred affinity 或单节点 selector。
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - 10.159.110.29
                          - 10.159.114.29
          restartPolicy: Never
          containers:
            - name: worker
              image: hub.bilibili.co/compile/library/busybox:1.36.1
              imagePullPolicy: IfNotPresent
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              command:
                - sh
                - -c
                - echo "lesson=08 case=pack pod=${POD_NAME} node=${NODE_NAME}"; sleep 120
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
